include:
  # user configuration scope
  - name: "user"
    path_override_env_var: SPACK_USER_CONFIG_PATH
    path: "~/.spack"
    optional: true
    prefer_modify: true
    when: '"SPACK_DISABLE_LOCAL_CONFIG" not in env'

  # site configuration scope
  - name: "site"
    path: "$spack/etc/spack/site"
    optional: true

  # system configuration scope
  - name: "system"
    path_override_env_var: SPACK_SYSTEM_CONFIG_PATH
    path: "/etc/spack"
    optional: true
    when: '"SPACK_DISABLE_LOCAL_CONFIG" not in env'

  # almalinux9 Packages
  - path: "/etc/spack/linux/almalinux9"
    optional: true
    when: 'os == "almalinux9"'

  # almalinux10 Packages
  - path: "/etc/spack/linux/almalinux10"
    optional: true
    when: 'os == "almalinux10"'

